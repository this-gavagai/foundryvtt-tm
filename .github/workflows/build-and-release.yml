name: build-and-release
run-name: ${{ github.actor }} triggered a build and release
on:
  push:
    tags:
      - '*'
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build
        # Bake the git tag into the app bundle (Vite reads APP_VERSION) so the
        # app/module version handshake compares the real release, not the dev
        # placeholder. The package.json/module.json edits below run AFTER the
        # build, so they can't be the source of the bundled app version.
        run: APP_VERSION=${{ github.ref_name }} npm run build-only

      - name: update package.json version info
        uses: jossef/action-set-json-field@v2.1
        with:
          file: package.json
          field: version
          value: ${{ github.ref_name }}

      - name: update module.json version info
        uses: jossef/action-set-json-field@v2.1
        with:
          file: tablemate/module.json
          field: version
          value: ${{ github.ref_name }}

      - name: update module.json version info
        uses: jossef/action-set-json-field@v2.1
        with:
          file: tablemate/module.json
          field: download
          value: https://github.com/this-gavagai/foundryvtt-tm/releases/download/${{ github.ref_name }}/tabulamensa.zip

      - name: Zip Files
        working-directory: ./tablemate
        run: zip -r ./tabulamensa.zip ./*

      - name: Create Version Release
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false
          draft: false
          prerelease: true
          generateReleaseNotes: true
          token: ${{ secrets.WORKFLOW_KEY }}
          artifacts: './tablemate/module.json,./tablemate/tabulamensa.zip'

  build-ios:
    # Build & upload the iOS app to TestFlight once the GitHub release exists.
    needs: build-release
    # macos-26 ships Xcode 26 / the iOS 26 SDK, which Apple now requires for all
    # App Store Connect uploads (older images default to Xcode 16 / iOS 18 SDK,
    # which the upload step rejects with a 409 SDK-version error).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        # Pin to the newest installed Xcode so the build uses the iOS 26 SDK even
        # if the image later adds a newer default or keeps an older one around.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: List signing identities (diagnostic)
        # Expect to see "Apple Distribution: Peter Graif". If only "Apple
        # Development" appears, the IOS_DIST_CERT_BASE64 secret is the wrong cert.
        run: security find-identity -v -p codesigning

      - name: Build and upload to TestFlight
        env:
          # The git tag (e.g. alpha-0106) — baked into the web bundle, the
          # CFBundleVersion build number, and the TestFlight changelog.
          APP_VERSION: ${{ github.ref_name }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: bundle exec fastlane ios beta

  build-ios-unsigned:
    # Attach an unsigned IPA to the release for people who self-sign with
    # Sideloadly or AltStore — the iOS analog of the sideload APK below.
    # Deliberately holds no secrets: the artifact carries no signature, so this
    # job still runs on forks and can't be broken by an expired certificate.
    needs: build-release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build unsigned IPA
        env:
          # Baked into the web bundle and the CFBundleVersion, exactly as in the
          # TestFlight job — only the signing is left out.
          APP_VERSION: ${{ github.ref_name }}
        run: bundle exec fastlane ios unsigned

      - name: Attach unsigned IPA to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          replacesArtifacts: true
          token: ${{ secrets.WORKFLOW_KEY }}
          tag: ${{ github.ref_name }}
          artifacts: ./build/tabulamensa-unsigned.ipa

  build-android:
    # Build a signed APK and attach it to the GitHub release for manual install
    # (sideloading) — the Android analog of the iOS TestFlight upload.
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode signing keystore
        # The keystore (a self-signed cert + private key) is stored as a base64
        # secret; write it to a temp file that build.gradle reads via env. Strip
        # any whitespace/line-wrapping first — a wrapped secret decodes to a
        # corrupt .jks (keytool: "toDerInputStream rejects tag type ...").
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null \
            && echo "Keystore decoded and readable." \
            || { echo "::error::Decoded keystore is unreadable — re-create the ANDROID_KEYSTORE_BASE64 secret as a single line (see below)."; exit 1; }

      - name: Build signed APK
        env:
          # The git tag (e.g. alpha-0106) — baked into the web bundle, the
          # versionName, and (its digits) the versionCode.
          APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android build

      - name: Attach APK to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          replacesArtifacts: true
          token: ${{ secrets.WORKFLOW_KEY }}
          tag: ${{ github.ref_name }}
          artifacts: ./android/app/build/outputs/apk/release/tabulamensa.apk

  publish-play:
    # Upload the release AAB to a Play testing track. Separate from build-android
    # because the two produce different artifacts for different audiences: that
    # job builds the sideload APK for the GitHub release, this one builds the
    # bundle Play requires.
    #
    # Which track is a repository variable rather than a literal so it can be
    # changed without editing this file. supply's names predate the Console's:
    # alpha is closed testing, beta is open testing.
    #
    # It accepts a comma-separated list, uploaded once and promoted to the rest.
    # PLAY_TRACK=internal,alpha is the useful pairing during a closed test:
    # internal skips Play review, so the build reaches your own device while the
    # testers' copy is still pending — a few hours to catch a bad build before
    # twelve people install it. It also sidesteps the eligibility rule that a
    # user opted into internal cannot receive a closed test.
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for Play credentials
        # The service account is set up separately in the Play Console, so this
        # job has to tolerate its absence rather than turning every release red
        # before that happens.
        id: creds
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload."
          fi

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: steps.creds.outputs.present == 'true'
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        if: steps.creds.outputs.present == 'true'
        run: npm install

      - uses: ruby/setup-ruby@v1
        if: steps.creds.outputs.present == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode signing keystore
        # Play verifies the upload key on every bundle, so this job needs the
        # same keystore as the APK build.
        if: steps.creds.outputs.present == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null \
            && echo "Keystore decoded and readable." \
            || { echo "::error::Decoded keystore is unreadable — re-create the ANDROID_KEYSTORE_BASE64 secret as a single line."; exit 1; }

      - name: Build and upload the AAB to Play
        if: steps.creds.outputs.present == 'true'
        env:
          APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
        run: bundle exec fastlane android play
